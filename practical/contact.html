<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudentHub - Contact">
    <title>StudentHub - Contact</title>
    <link rel="stylesheet" href="D:\WDF\html\practical\css\style.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
    <h1>Contact us</h1>

    <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main id="main-content" class="layout layout--sidebar">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
            <li><a href="index.html">Home</a></li>
            <li aria-current="page">Contact</li>
        </ol>
    </nav>
    <section class="card" aria-labelledby="contact-title"
         style="grid-column: 1 / -1; justify-self: center; width: min(100%, 430px); box-sizing: border-box;">
        <h2 id="contact-title">Send us a message</h2>

        <form class="form" action="#" method="post">
            <div class="field">
                <label for="contact-name">Your name</label>
                <input type="text" id="contact-name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="contact-email">Email address</label>
                <input type="email" id="contact-email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="5" required></textarea>
            </div>
            <button class="btn" type="submit">Send message</button>
        </form>
    </section>

    <aside class="card" aria-labelledby="reach-title">
        <h2 id="reach-title">Reach us</h2>
        <address>
            StudentHub Support<br>
            Email: <a href="mailto:support@studenthub.example">support@studenthub.example</a>
        </address>
    </aside>
</main>

<footer class="site-footer">
    <p>&copy; 2026 StudentHub</p>
    <nav class="footer-nav" aria-label="Footer navigation">
        <a href="profile.html">Profile</a>
        <a href="feedback.html">Feedback</a>
        <a href="admin.html">Admin</a>
    </nav>
</footer>

</body>
</html>
