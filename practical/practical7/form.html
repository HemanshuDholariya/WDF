<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Student Registration - StudentHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color: #f4f6f8; padding: 20px; }
.container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
h2 { color: #1e3a8a; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">
<h2>Student Registration Form</h2>
<form action="process.php" method="POST">
<div class="mb-3">
<label class="form-label">Full Name:</label>
<input type="text" name="name" class="form-control" placeholder="Enter full name" required>
</div>
<div class="mb-3">
<label class="form-label">Email Address:</label>
<input type="email" name="email" class="form-control" placeholder="Enter email" required>
</div>
<div class="mb-3">
<label class="form-label">Enrollment Number:</label>
<input type="text" name="enrollment" class="form-control" placeholder="e.g.
25CE025" required>
</div>
<div class="mb-3">
<label class="form-label">Course / Branch:</label>

<select name="course" class="form-select" required>
<option value="">Select Course</option>
<option value="Computer Engineering">Computer Engineering</option>
<option value="Information Technology">Information Technology</option>
<option value="Electronics & Communication">Electronics & Communication</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Gender:</label><br>
<input type="radio" name="gender" value="Male" required> Male &nbsp;
<input type="radio" name="gender" value="Female"> Female &nbsp;
<input type="radio" name="gender" value="Other"> Other
</div>
<button type="submit" class="btn btn-primary" style="background-color: #1e3a8a;">Submit Registration</button>
<a href="view.php" class="btn btn-secondary">View Records</a>
</form>
</div>
</body>
</html>
