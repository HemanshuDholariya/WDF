<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Event Manager (AJAX) - StudentHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f4f6f8; padding: 25px; }
.box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
h3 { color: #1e3a8a; } #status { min-height: 40px; }
</style>
</head>
<body>
<div class="container box">
<h3 class="mb-3">Event Manager – AJAX / Fetch API (No Page Reload)</h3>


<!-- Status Messages -->
<div id="status"></div>


<!-- Search -->
<div class="row g-2 mb-3">
<div class="col-md-8">
<input type="text" id="searchBox" class="form-control" placeholder="Search events by title (debounced)...">
</div>
<div class="col-md-4">
<button class="btn btn-outline-primary w-100" onclick="loadEvents()">Refresh List</button>
</div>
</div>



<!-- Add Event Form -->
<div class="card mb-3">
<div class="card-header" style="background-color: #1e3a8a; color: white;">Add New Event</div>
<div class="card-body">
<div class="row g-2">
<div class="col-md-4"><input type="text" id="addTitle" class="form-control" placeholder="Event Title"></div>
<div class="col-md-3"><input type="date" id="addDate" class="form-control"></div>
<div class="col-md-3">
<select id="addCategory" class="form-select">
<option value="Workshop">Workshop</option>
<option value="Seminar">Seminar</option>
<option value="Cultural">Cultural</option>
<option value="Sports">Sports</option>
<option value="Technical">Technical</option>
</select>
</div>
<div class="col-md-2"><button class="btn btn-success w-100" onclick="addEvent()">Add</button></div>
</div>
</div>
</div>


<!-- Events Table -->
<table class="table table-bordered table-striped align-middle">
<thead class="table-dark">
<tr><th>ID</th><th>Title</th><th>Date</th><th>Category</th><th>Status</th><th
>Actions</th></tr>

</thead>
<tbody id="eventsBody">
<tr><td colspan="6" class="text-center text-muted">Loading events...</td></tr>
</tbody>
</table>
</div>


<script src="app.js"></script>
</body>
</html>
