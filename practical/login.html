<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StudentHub - Login">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
    <h1>Log in</h1>

    <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" aria-current="page">Login</a>
    </nav>
</header>

<main id="main-content" class="layout ">
    <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
            <li><a href="index.html">Home</a></li>
            <li aria-current="page">Login</li>
        </ol>
    </nav>
    <section class="card" aria-labelledby="login-title">
        <h2 id="login-title">Welcome back</h2>

        <form class="form" action="#" method="post">
            <div class="field">
                <label for="login-email">Email address</label>
                <input type="email" id="login-email" name="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit">Log in</button>
        </form>
        <p>New here? <a href="register.html">Create an account</a>.</p>
    </section>
</main>

<footer class="site-footer">
    <p>&copy; 2026 StudentHub</p>
    <nav class="footer-nav" aria-label="Footer navigation">
        <a href="profile.html">Profile</a>
        <a href="feedback.html">Feedback</a>
        <a href="admin.html">Admin</a>
    </nav>
</footer>

</body>
</html>
