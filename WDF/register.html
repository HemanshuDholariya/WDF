<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
   
}

.container{
    width:400px;
    margin:50px auto;
    background:rgba(255,255,255,0.9);
    padding: 25px;
    border-radius:15px;
    box-shadow:20 0 15px gray;
}

h1{
    text-align:center;
    color:#0066cc;
}

table{
    width:100%;
}

td{
    padding:10px;
}

input,select,textarea{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

input[type=radio]{
    width:auto;
}

.button{
    text-align:center;
}

.button input{
    width:120px;
    padding:10px;
    border:none;
    border-radius:20px;
    background:#0066cc;
    color:white;
    cursor:pointer;
}

.button input:hover{
    background:#003366;
}

</style>

</head>
<body>

<div class="container">

<h1>Student Registration</h1>

<form action="form.html" >

<table>

<tr>
<td>Name</td>
<td><input type="text"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email"></td>
</tr>

<tr>
<td>Password</td>
<td><input type="password"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="g">Male
<input type="radio" name="g">Female
</td>
</tr>

<tr>
<td>Course</td>
<td>
<select>
<option>B.Tech</option>
<option>BCA</option>
<option>BBA</option>
<option>MCA</option>
</select>
</td>
</tr>

<tr>
<td>Address</td>
<td><textarea rows="3"></textarea></td>
</tr>

<tr>
<td colspan="2" class="button">
<input type="submit" value="Register">
</td>
</tr>

</table>

</form>

</div>

</body>
</html>
